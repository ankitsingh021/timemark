<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Time & Location Stamper</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .canvas-container {
            margin-top: 20px;
            text-align: center;
            overflow: auto;
            max-width: 100%;
        }
        canvas {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: none; /* Hidden until image is generated */
        }
        #downloadBtn {
            display: none;
            background-color: #008CBA;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
        #downloadBtn:hover {
            background-color: #007bb5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Image Stamper</h2>
    
    <div class="form-group">
        <label for="imageInput">Upload Image:</label>
        <input type="file" id="imageInput" accept="image/png, image/jpeg">
    </div>

    <div class="form-group">
        <label for="timeInput">Time / Date:</label>
        <input type="text" id="timeInput" placeholder="e.g., Sat, 15 Aug 2026 02:30 pm" value="Sat, 15 Aug 2026 02:30 pm">
    </div>

    <div class="form-group">
        <label for="addressInput">Location / Address:</label>
        <input type="text" id="addressInput" placeholder="e.g., 687, Jan Path, Jaipur, Rajasthan" value="687, Jan Path, Sunder Nagar, Jaipur, Rajasthan">
    </div>

    <button onclick="generateImage()">Apply Stamp</button>
    <a id="downloadBtn" download="stamped_image.png">Download Image</a>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
</div>

<script>
    function generateImage() {
        const imageInput = document.getElementById('imageInput');
        const timeText = document.getElementById('timeInput').value;
        const addressText = document.getElementById('addressInput').value;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!imageInput.files || !imageInput.files[0]) {
            alert("Please select an image first.");
            return;
        }

        const reader = new FileReader();
        
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                // Set canvas size to match the original image exactly
                canvas.width = img.width;
                canvas.height = img.height;

                // Draw original image
                ctx.drawImage(img, 0, 0);

                // Setup overlay dimensions relative to image size
                const boxWidth = img.width * 0.55; 
                const boxHeight = img.height * 0.15;
                const x = 0;
                const y = img.height - boxHeight;

                // Draw semi-transparent background
                ctx.fillStyle = 'rgba(70, 110, 80, 0.8)';
                ctx.fillRect(x, y, boxWidth, boxHeight);

                // Draw borders
                ctx.strokeStyle = '#4CAF50';
                ctx.lineWidth = Math.max(2, img.width * 0.003); // Scale border
                ctx.strokeRect(x, y, boxWidth, boxHeight);
                
                // Draw horizontal line separator
                ctx.beginPath();
                ctx.moveTo(x, y + (boxHeight / 2));
                ctx.lineTo(x + boxWidth, y + (boxHeight / 2));
                ctx.stroke();
                
                // Draw vertical line separator
                const colDivider = x + (boxWidth * 0.25);
                ctx.beginPath();
                ctx.moveTo(colDivider, y);
                ctx.lineTo(colDivider, y + boxHeight);
                ctx.stroke();

                // Setup text styling
                ctx.fillStyle = '#FFFFFF';
                // Scale font size based on image height
                const labelFontSize = Math.floor(img.height * 0.025);
                const dataFontSize = Math.floor(img.height * 0.022);
                
                // Write Labels (Left Column)
                ctx.font = `${labelFontSize}px sans-serif`;
                ctx.textBaseline = 'middle';
                ctx.fillText('Time', x + 20, y + (boxHeight * 0.25));
                ctx.fillText('Address', x + 20, y + (boxHeight * 0.75));

                // Write Data (Right Column)
                ctx.font = `${dataFontSize}px sans-serif`;
                ctx.fillText(timeText, colDivider + 20, y + (boxHeight * 0.25));
                
                // Simple address text implementation (You could add line-wrapping logic here for very long addresses)
                ctx.fillText(addressText, colDivider + 20, y + (boxHeight * 0.75));

                // Show canvas and download button
                canvas.style.display = 'block';
                downloadBtn.style.display = 'block';
                downloadBtn.href = canvas.toDataURL('image/png');
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(imageInput.files[0]);
    }
</script>

</body>
</html>
