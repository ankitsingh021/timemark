<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Station QR (refreshes every 5 s)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#1c1c1a;--muted:#6b6b66;--accent:#2f6fed;--track:#e3e3de;--border:#dcdcd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--text:#ececE8;--muted:#9a9a94;--accent:#6e9bff;--track:#33332f;--border:#3a3a36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--text:#ececE8;--muted:#9a9a94;--accent:#6e9bff;--track:#33332f;--border:#3a3a36;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:400px;text-align:center}
h1{font-size:18px;margin:0 0 16px}
label{display:block;text-align:left;font-size:13px;color:var(--muted);margin-bottom:4px}
input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;margin-bottom:16px}
.qr{background:#fff;padding:8px;border-radius:12px;display:inline-block;line-height:0}
canvas{max-width:100%;height:auto}
.bar{height:6px;background:var(--track);border-radius:3px;margin:16px 0 8px;overflow:hidden}
.bar>div{height:100%;width:100%;background:var(--accent)}
.meta{font-size:13px;color:var(--muted);margin:4px 0;word-break:break-all;text-align:left}
code{font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="card">
  <h1>Live station QR</h1>
  <label for="sid">Station ID</label>
  <input id="sid" value="WMQISXM1V1-01296" autocomplete="off">
  <div class="qr"><canvas id="c"></canvas></div>
  <div class="bar"><div id="fill"></div></div>
  <div class="meta" id="count">Refreshing in 5 s</div>
  <div class="meta">Timestamp (ms): <code id="ts"></code></div>
  <div class="meta">UTC: <code id="utc"></code></div>
  <div class="meta">IST: <code id="ist"></code></div>
  <div class="meta">Payload: <code id="pl"></code></div>
</div>
<script>
(function(){
  var INTERVAL = 5000, next = 0;
  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var $ = function(id){ return document.getElementById(id); };

  function drawQR(text){
    var qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    var n = qr.getModuleCount(), quiet = 2, cell = Math.max(3, Math.floor(280 / (n + quiet * 2)));
    var size = (n + quiet * 2) * cell;
    canvas.width = size; canvas.height = size;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#000";
    for (var r = 0; r < n; r++)
      for (var c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
  }

  function refresh(){
    var ts = Date.now(), id = $("sid").value.trim();
    var payload = JSON.stringify({stationId: id, timestamp: ts});
    drawQR(payload);
    var d = new Date(ts);
    $("ts").textContent = ts;
    $("utc").textContent = d.toISOString().replace("T", " ").replace("Z", " UTC");
    $("ist").textContent = new Date(ts + 19800000).toISOString().replace("T", " ").replace("Z", " IST");
    $("pl").textContent = payload;
    next = ts + INTERVAL;
  }

  function tick(){
    var left = Math.max(0, next - Date.now());
    $("fill").style.width = (left / INTERVAL * 100) + "%";
    $("count").textContent = "Refreshing in " + Math.ceil(left / 1000) + " s";
  }

  refresh();
  setInterval(refresh, INTERVAL);
  setInterval(tick, 100);
  $("sid").addEventListener("input", refresh);
})();
</script>
</body>
</html>
