<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Responsive Image Stamper</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #4CAF50;
            --accent-hover: #45a049;
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .layout {
            display: flex;
            flex-wrap: wrap;
            flex: 1;
        }

        .controls {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            background: var(--panel-bg);
            padding: 20px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .preview-container {
            flex: 2;
            min-width: 300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0a0a0a;
        }

        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .input-group { margin-bottom: 15px; }
        
        label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        
        input[type="text"], input[type="file"], select, input[type="color"], input[type="range"] {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button {
            background-color: #333;
            color: white;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            flex: 1;
            transition: 0.2s;
        }

        button:hover { background-color: #444; }
        
        button.primary { background-color: var(--accent); border-color: var(--accent); font-weight: bold; font-size: 16px; padding: 12px; margin-top: 10px;}
        button.primary:hover { background-color: var(--accent-hover); }

        canvas {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
        }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .controls { max-width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>

<div class="layout">
    <div class="controls">
        <h2>Stamp Settings</h2>
        
        <div class="input-group">
            <label>1. Upload Photo</label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>

        <div class="input-group">
            <label>Time & Date</label>
            <input type="text" id="timeVal" value="" placeholder="Will auto-fill or type manually" class="live-update">
            <div class="btn-row">
                <button onclick="autoFillTime()">Auto-Fetch Current Time</button>
            </div>
        </div>

        <div class="input-group">
            <label>Location</label>
            <input type="text" id="addressVal" value="687, Jan Path, Sunder Nagar, Rani Sati Nagar, Nirman Nagar, Brijlalpura, Jaipur, Rajasthan 302019" class="live-update">
            <div class="btn-row">
                <button onclick="autoFillLocation()">Auto-Detect GPS Location</button>
            </div>
        </div>

        <div class="input-group">
            <label>Stamp Position</label>
            <select id="positionVal" class="live-update">
                <option value="bottom-left">Bottom Left</option>
                <option value="bottom-right">Bottom Right</option>
                <option value="top-left">Top Left</option>
                <option value="top-right">Top Right</option>
            </select>
        </div>

        <div class="input-group btn-row">
            <div style="flex: 1;">
                <label>Border</label>
                <input type="color" id="colorVal" value="#4CAF50" class="live-update">
            </div>
            <div style="flex: 1;">
                <label>Opacity</label>
                <input type="range" id="opacityVal" min="0" max="1" step="0.1" value="0.8" class="live-update">
            </div>
        </div>

        <button class="primary" onclick="downloadImage()" id="downloadBtn" style="display:none;">Download Stamped Photo</button>
    </div>

    <div class="preview-container">
        <div id="placeholder" class="placeholder-text">
            <h3>No Image Selected</h3>
            <p>Upload a photo on the left to see the live preview.</p>
        </div>
        <canvas id="photoCanvas"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d');
    let sourceImage = null;

    document.querySelectorAll('.live-update').forEach(input => {
        input.addEventListener('input', renderCanvas);
    });

    document.getElementById('imageUpload').addEventListener('change', function(e) {
        if (!e.target.files || e.target.files.length === 0) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            sourceImage = new Image();
            sourceImage.onload = () => {
                document.getElementById('placeholder').style.display = 'none';
                canvas.style.display = 'block';
                document.getElementById('downloadBtn').style.display = 'block';
                renderCanvas();
            };
            sourceImage.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    // Custom text wrapping function
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let currentY = y;

        for(let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = context.measureText(testLine);
            const testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                context.fillText(line, x, currentY);
                line = words[n] + ' ';
                currentY += lineHeight;
            }
            else {
                line = testLine;
            }
        }
        context.fillText(line, x, currentY);
    }

    function renderCanvas() {
        if (!sourceImage) return;

        canvas.width = sourceImage.width;
        canvas.height = sourceImage.height;
        ctx.drawImage(sourceImage, 0, 0);

        const timeText = document.getElementById('timeVal').value;
        const addressText = document.getElementById('addressVal').value;
        const position = document.getElementById('positionVal').value;
        const borderColor = document.getElementById('colorVal').value;
        const opacity = document.getElementById('opacityVal').value;

        // Base box dimensions (Widened slightly to ensure text fits)
        const boxWidth = sourceImage.width * 0.80; 
        const boxHeight = sourceImage.height * 0.16;
        const padding = sourceImage.width * 0.02;

        let startX, startY;

        if (position === 'bottom-left') {
            startX = 0; startY = sourceImage.height - boxHeight;
        } else if (position === 'bottom-right') {
            startX = sourceImage.width - boxWidth; startY = sourceImage.height - boxHeight;
        } else if (position === 'top-left') {
            startX = 0; startY = 0;
        } else if (position === 'top-right') {
            startX = sourceImage.width - boxWidth; startY = 0;
        }

        // Draw Background
        ctx.fillStyle = `rgba(20, 30, 25, ${opacity})`;
        ctx.fillRect(startX, startY, boxWidth, boxHeight);

        // Draw Border
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = Math.max(3, sourceImage.width * 0.004);
        ctx.strokeRect(startX, startY, boxWidth, boxHeight);

        // Grid Lines (2 Rows)
        const rowHeight = boxHeight / 2;
        // INCREASED divider space to 28% to give the "Address" label enough room
        const colDivider = startX + (boxWidth * 0.28); 

        ctx.beginPath();
        // Horizontal line
        ctx.moveTo(startX, startY + rowHeight);
        ctx.lineTo(startX + boxWidth, startY + rowHeight);
        // Vertical line
        ctx.moveTo(colDivider, startY);
        ctx.lineTo(colDivider, startY + boxHeight);
        ctx.stroke();

        // Typography Setup
        const labelSize = Math.floor(sourceImage.height * 0.024);
        let dataSize = Math.floor(sourceImage.height * 0.020);
        const maxTextWidth = boxWidth - (boxWidth * 0.28) - (padding * 2);

        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'left'; // Explicitly set to left to prevent wandering text
        
        // Draw Labels (Left Column - Middle Aligned)
        ctx.textBaseline = 'middle';
        ctx.font = `bold ${labelSize}px sans-serif`;
        ctx.fillText('Time', startX + padding, startY + (rowHeight * 0.5));
        ctx.fillText('Address', startX + padding, startY + (rowHeight * 1.5));

        // Draw Time Data
        ctx.font = `${dataSize}px sans-serif`;
        ctx.fillText(timeText, colDivider + padding, startY + (rowHeight * 0.5));
        
        // Draw Address Data (Top Aligned with Wrapping)
        ctx.textBaseline = 'top';
        const addressStartY = startY + rowHeight + (padding * 0.5);
        const lineHeight = dataSize * 1.3;
        wrapText(ctx, addressText, colDivider + padding, addressStartY, maxTextWidth, lineHeight);
    }

    function autoFillTime() {
        const now = new Date();
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('timeVal').value = now.toLocaleDateString('en-IN', options);
        renderCanvas();
    }

    function autoFillLocation() {
        const addressInput = document.getElementById('addressVal');
        addressInput.value = "Fetching GPS location...";
        renderCanvas();

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
                    const data = await response.json();
                    if (data && data.display_name) {
                        addressInput.value = data.display_name;
                        renderCanvas();
                    }
                } catch (error) {
                    addressInput.value = "Error fetching address network.";
                    renderCanvas();
                }
            }, (error) => {
                addressInput.value = "GPS Permission Denied.";
                renderCanvas();
            });
        } else {
            addressInput.value = "Geolocation not supported by browser.";
            renderCanvas();
        }
    }

    function downloadImage() {
        if (!sourceImage) return;
        const link = document.createElement('a');
        link.download = `stamped_export_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
    }

    autoFillTime();
</script>
</body>
</html>
